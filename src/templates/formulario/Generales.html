{% extends 'formulario/baseformulario.html' %}
{% block titulo %} Datos Generales {% endblock %}

{% block contenido %}
<div class="banner">
  <div class="container py-5">
    <div class="card shadow-lg rounded-4">
      <div class="card-body p-5">
        <div class="row text-center">
          <!-- SVG code remains the same -->
          <h5 class="pb-2 text-center" style="font-size: 2.5rem;">Informacion General</h5>
        </div>

        <hr class="hr-navbar opacity-100 my-4">
        <form action="/general" method="post" id="generalForm" onsubmit="return validarFormulario()">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
          {% with messages = get_flashed_messages() %}
          {% if messages %}
          <br />
          {% for message in messages %}
          <div class="alert alert-primary alert-dismissible" role="alert">
            <strong>{{ message }}</strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
          </div>
          {% endfor %}
          {% endif %}
          {% endwith %}
          
          <!-- Grupo 1 de campos del formulario -->
          <div class="row contenedor-campos">
            <div class="col-md-4">
              <label class="text-label" for="NombreInput">Nombre(s)</label>
              <div class="form-group my-3">
                <input type="text" name="nombres" class="datos" id="NombreInput" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" 
                       placeholder="Ingresa tu nombre" required>
                <div class="error-message text-danger" style="display: none;"></div>
              </div>
            </div>
            <div class="col-md-4">
              <label class="text-label" for="apellidopInput">Apellido paterno</label>
              <div class="form-group my-3">
                <input type="text" name="apellido_p" class="datos" id="apellidopInput" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+"
                       placeholder="Ingresa tu apellido paterno" required>
                <div class="error-message text-danger" style="display: none;"></div>
              </div>
            </div>
            <div class="col-md-4">
              <label class="text-label" for="apellidomInput">Apellido materno</label>
              <div class="form-group my-3">
                <input type="text" name="apellido_m" class="datos" id="apellidomInput" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+"
                       placeholder="Ingresa tu apellido materno" required>
                <div class="error-message text-danger" style="display: none;"></div>
              </div>
            </div>
          </div>

          <!-- Grupo 2 de campos del formulario -->
          <div class="row contenedor-campos">
            <div class="col-md-4">
              <label class="text-label" for="sexoInput">Sexo</label>
              <div class="form-group my-3">
                <select class="datos" name="sexo" id="sexoInput" required>
                  <option value="">Selecciona una opción</option>
                  <option value="Masculino">Masculino</option>
                  <option value="Femenino">Femenino</option>
                  <option value="Otro">Otro</option>
                </select>
                <div class="error-message text-danger" style="display: none;"></div>
              </div>
            </div>
            <div class="col-md-4">
              <label class="text-label" for="celInput">Teléfono de contacto</label>
              <div class="form-group my-3">
                <input type="tel" name="tel_contacto" class="datos" id="celInput"
                       pattern="[0-9]{10}" maxlength="10"
                       placeholder="10 dígitos" required>
                <div class="error-message text-danger" style="display: none;"></div>
              </div>
            </div>
            <div class="col-md-4">
              <label class="text-label" for="correoInput">Correo electrónico</label>
              <div class="form-group my-3">
                <input type="email" name="correo_alumno" class="datos" id="correoInput" 
                       placeholder="ejemplo@dominio.com" required>
                <div class="error-message text-danger" style="display: none;"></div>
              </div>
            </div>
          </div>

          <!-- Los demás grupos mantienen la misma estructura base pero con validaciones específicas -->
          <div class="row contenedor-campos">
            <div class="col-md-4">
              <label class="text-label" for="codigo_postal">Código postal</label>
              <div class="form-group my-3">
                <input type="text" name="codigo_postal" class="datos" id="codigo_postal"
                       pattern="[0-9]{5}" maxlength="5" minlength="5"
                       placeholder="5 dígitos" required>
                <div class="error-message text-danger" style="display: none;"></div>
              </div>
            </div>
            <div class="col-md-4">
              <label class="text-label" for="paisInput">Pais</label>
              <div class="form-group my-3">
                <input type="text" name="pais" class="datos" id="paisInput" placeholder="Ingresa tu pais" required>
              </div>
            </div>
            
            <div class="col-md-4">
              <label class="text-label" for="id_estado">Estado</label>
              <div class="form-group my-3">
                <select name="estado" class="datos" id="id_estado" required>
                  <option value="">Selecciona una opción</option>
                  <option value="1">Aguascalientes</option>
                  <option value="2">Baja California</option>
                  <option value="3">Baja California Sur</option>
                  <option value="4">Campeche</option>
                  <option value="8">Chihuahua</option>
                  <option value="7">Chiapas</option>
                  <option value="9">Ciudad de México</option>
                  <option value="5">Coahuila de Zaragoza</option>
                  <option value="6">Colima</option>
                  <option value="10">Durango</option>
                  <option value="12">Guerrero</option>
                  <option value="11">Guanajuato</option>
                  <option value="13">Hidalgo</option>
                  <option value="14">Jalisco</option>
                  <option value="15">Estado de México</option>
                  <option value="16">Michoacán de Ocampo</option>
                  <option value="17">Morelos</option>
                  <option value="18">Nayarit</option>
                  <option value="19">Nuevo León</option>
                  <option value="20">Oaxaca</option>
                  <option value="21">Puebla</option>
                  <option value="22">Querétaro</option>
                  <option value="23">Quintana Roo</option>
                  <option value="25">Sinaloa</option>
                  <option value="24">San Luis Potosí</option>
                  <option value="26">Sonora</option>
                  <option value="27">Tabasco</option>
                  <option value="28">Tamaulipas</option>
                  <option value="29">Tlaxcala</option>
                  <option value="30">Veracruz de Ignacio de la Llave</option>
                  <option value="31">Yucatán</option>
                  <option value="32">Zacatecas</option>
                </select>
                <div class="error-message text-danger" style="display: none;"></div>
              </div>
            </div>
          </div>


          <!-- Grupo 4 de campos del formulario -->
          <div class="row contenedor-campos">
            <div class="col-md-4">
              <label class="text-label" for="id_municipio">Municipio</label>
              <div class="form-group my-3">
                <input type="text" name="ciudad" class="datos" id="municipio" placeholder="Ingresa tu municipio"
                  required="">
              </div>
            </div>
            <div class="col-md-4">
              <label class="text-label" for="id_colonia">Colonia</label>
              <div class="form-group my-3">
                <input type="text" name="colonia" class="datos" id="colonia" placeholder="Ingresa tu colonia"
                  required="">
              </div>
            </div>
            <div class="col-md-4">
              <label class="text-label" for="nacionalidadInput">Nacionalidad</label>
              <div class="form-group my-3">
                <input type="text" name="nacionalidad" class="datos" id="nacionalidadInput"
                  placeholder="Ingresa tu nacionalidad" required>
              </div>
            </div>
          </div>

          <!-- Grupo fecha de nacimiento -->
          <div class="row contenedor-campos">
            <div class="col-md-4">
              <label class="text-label" for="fechanacimientoInput">Fecha de nacimiento</label>
              <div class="form-group my-3">
                <input type="date" name="f_nacimiento" class="datos" id="fechanacimientoInput" required>
                <div class="error-message text-danger" style="display: none;"></div>
              </div>
            </div>
          </div>

          <hr class="hr-navbar opacity-100 my-4">
          <div class="nav-buttons mt-4 text-end">
            <button type="submit" class="btn-siguiente">Siguiente</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
function validarFormulario() {
  let isValid = true;
  const errores = document.querySelectorAll('.error-message');
  errores.forEach(error => error.style.display = 'none');
 
  // Validar Estado
  const estado = document.getElementById('id_estado');
  if (estado.value === "0") {
    mostrarError('id_estado', 'Selecciona un estado');
    isValid = false;
  }

  // Validar fecha de nacimiento
  const fechaNacimiento = new Date(document.getElementById('fechanacimientoInput').value);
  const hoy = new Date();
  const edad = hoy.getFullYear() - fechaNacimiento.getFullYear();
  const mes = hoy.getMonth() - fechaNacimiento.getMonth();
  
  if (fechaNacimiento > hoy) {
    mostrarError('fechanacimientoInput', 'La fecha no puede ser futura');
    isValid = false;
  } else if (edad < 18 || (edad === 18 && mes < 0)) {
    mostrarError('fechanacimientoInput', 'Debes ser mayor de 18 años');
    isValid = false;
  }

  // Validar teléfono
  const telefono = document.getElementById('celInput');
  if (!telefono.value.match(/^[0-9]{10}$/)) {
    mostrarError('celInput', 'El teléfono debe tener 10 dígitos numéricos');
    isValid = false;
  }

  // Validar correo
  const correo = document.getElementById('correoInput');
  if (!correo.value.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
    mostrarError('correoInput', 'Ingresa un correo electrónico válido');
    isValid = false;
  }

  // Validar código postal
  const cp = document.getElementById('codigo_postal');
  if (!cp.value.match(/^[0-9]{5}$/)) {
    mostrarError('codigo_postal', 'El código postal debe tener 5 dígitos numéricos');
    isValid = false;
  }

  // Validar campos de texto (nombre, apellidos)
  const camposTexto = ['NombreInput', 'apellidopInput', 'apellidomInput'];
  camposTexto.forEach(campo => {
    const input = document.getElementById(campo);
    if (!input.value.match(/^[A-Za-záéíóúÁÉÍÓÚñÑ\s]+$/)) {
      mostrarError(campo, 'Solo se permiten letras y espacios');
      isValid = false;
    }
  });

  return isValid;
}

function mostrarError(id, mensaje) {
  const elemento = document.getElementById(id);
  const errorDiv = elemento.parentElement.querySelector('.error-message');
  errorDiv.style.display = 'block';
  errorDiv.textContent = mensaje;
}

// Establecer la fecha máxima como hoy menos 18 años
window.onload = function() {
  const hoy = new Date();
  const maxDate = new Date(hoy.getFullYear() - 18, hoy.getMonth(), hoy.getDate());
  document.getElementById('fechanacimientoInput').max = maxDate.toISOString().split('T')[0];
}
</script>
{% endblock %}
