{% extends 'formulario/baseformulario.html' %} 
{% block titulo %} Datos Generales {% endblock %}

{% block contenido %}
  <div class="banner">
    <div class="container p-5">
      <div class="card mx-3 mt-n5 shadow-lg">
        <div class="card-body p-5">
          <div class="row text-center">
            <h5 class="pb-2" style="font-size: 2.5rem;">Información Laboral</h5>
          </div>
          
          <hr class="hr-navbar opacity-100 my-4">
          <form action="/laboral" method="POST" onsubmit="return confirmarEnvio()">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <!-- Grupo 1 de campos del formulario -->
            <div class="row">
                <div class="col-md-4">
                    <label class="text-label" for="trabajoInput">¿Estás actualmente trabajando?</label>
                    <div class="form-group my-3">
                        <select class="datos" id="trabajoInput" name="trabajasiono" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="Si">Si</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="text-label" for="nombreempresaInput">Nombre del lugar de trabajo</label>
                    <div class="form-group my-3">
                        <input type="text" class="datos" id="nombreempresaInput" name="lugardetrabajo" placeholder="Ingresa el nombre del lugar de trabajo" required data-na>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="text-label" for="horarioInput">Horario laboral</label>
                    <div class="form-group my-3">
                        <input type="text" class="datos" id="horarioInput" name="horariolaboral" placeholder="Ejemplo: Lunes a viernes, de 9:00 a 17:00" required data-na>
                    </div>
                </div>
                
    
            <!-- Grupo 2 de campos del formulario -->
            <div class="row">
                <div class="col-md-4">
                    <label class="text-label" for="puestoInput">Puesto de trabajo</label>
                    <div class="form-group my-3">
                        <input type="text" class="datos" id="puestoInput" name="puestolaboral" placeholder="Ingresa tu puesto" required data-na>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="text-label" for="sectorInput">Sector</label>
                    <div class="form-group my-3">
                        <select class="datos" id="sectorInput" name="sector" required data-na>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="Publico">Público</option>
                            <option value="Privado">Privado</option>
                            <option value="NoAplica">N/A</option>
                        </select>
                    </div>
                </div>
                <hr class="hr-navbar opacity-100 my-4">
                
                <!-- Botones de navegación -->
                <div class="nav-buttons mt-4 text-end">
                    <button type="submit" class="btn-siguiente">Siguiente</button>
                </div>
            </div>
        </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    function confirmarEnvio() {
        const trabajoInput = document.getElementById('trabajoInput');
        const nombreempresaInput = document.getElementById('nombreempresaInput');
        const horarioInput = document.getElementById('horarioInput');
        const puestoInput = document.getElementById('puestoInput');
        const sectorInput = document.getElementById('sectorInput');

        // Validar que el campo 'Trabajo' tenga una opción seleccionada
        if (trabajoInput.value === '') {
            alert("Por favor, selecciona si estás trabajando o no.");
            return false;
        }

        // Validar que si 'Trabajo' es 'Sí', todos los demás campos sean completados
        if (trabajoInput.value === 'Si') {
            if (!nombreempresaInput.value || !horarioInput.value || !puestoInput.value || !sectorInput.value) {
                alert("Por favor, completa todos los campos obligatorios.");
                return false;
            }
        }

        // Confirmar el envío
        return confirm("¿Seguro que quieres enviar tus datos?");
    }

    document.addEventListener('DOMContentLoaded', function () {
        const trabajoInput = document.getElementById('trabajoInput');
        const camposNA = document.querySelectorAll('[data-na]');

        trabajoInput.addEventListener('change', function () {
            if (this.value === 'No') {
                camposNA.forEach(function (campo) {
                    if (campo.tagName === 'SELECT') {
                        campo.value = 'NoAplica';
                        campo.style.pointerEvents = 'none';
                    } else {
                        campo.value = 'N/A';
                        campo.readOnly = true;
                    }
                    campo.style.backgroundColor = '#e9ecef';
                });
            } else {
                camposNA.forEach(function (campo) {
                    if (campo.tagName === 'SELECT') {
                        campo.selectedIndex = 0;
                        campo.style.pointerEvents = 'auto';
                    } else {
                        campo.value = '';
                        campo.readOnly = false;
                    }
                    campo.style.backgroundColor = '';
                });
            }
        });

        camposNA.forEach(function (campo) {
            campo.addEventListener('input', function () {
                if (trabajoInput.value === 'No') {
                    if (this.tagName === 'SELECT') {
                        this.value = 'NoAplica';
                    } else {
                        this.value = 'N/A';
                    }
                }
            });
        });
    });
  </script>
{% endblock %}
